# BetterMath 自动部署流水线
#
# 架构：服务器本机自建自部署（不经 artifact 中转）
#   · 唯一的 job 跑在 YlxcServer 的 self-hosted runner 上：
#     checkout → npm ci → npm run build → rsync dist 到站点目录
#
# 与博客（website 仓库）同一套做法，区别只有两点：
#   · 用的是**另一个 runner 实例** /opt/actions-runner-bettermath（标签 bettermath-deploy），
#     博客的 /opt/actions-runner（标签 myhomeweb-deploy）完全不动
#   · job 与目标目录同机，rsync 走本地路径，不需要任何 SSH 私钥
#
# 安全设计：
#   · 全程无 SSH 私钥参与：job 就跑在目标服务器本机
#   · 仅 main 推送 / 手动触发
#   · concurrency 串行部署，避免两次推送同时镜像造成竞态
#   · 镜像前校验 dist 完整性，rsync 后再次自检（见下文闸门）
#
# 前置条件（服务器 YlxcServer 已就绪）：
#   · /opt/actions-runner-bettermath 已注册为 systemd 服务（标签 bettermath-deploy）
#   · runner 用户 ghrunner 具备 Node 22+ 与 npm
#   · /var/www/bettermath 属主 ghrunner:www-data，nginx worker 以 www-data 可读

name: Deploy BetterMath

# 2026-11-27：服务器上的 self-hosted runner 已撤除（各约 50 MB 常驻内存，
# 1.6 GiB 的小机器吃不消），部署改为本地手动执行 scripts/deploy.sh。
# 这里只保留手动触发，避免 push 产生永远排队、无人执行的 job；
# 如将来恢复 CI，把 push 触发加回并重新注册 runner 即可。
on:
  workflow_dispatch:

concurrency:
  group: deploy-bettermath
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (server self-hosted)
    runs-on: [self-hosted, bettermath-deploy]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # 不装 setup-node：runner 机器上已有 Node 24.19.0 / npm 11.17.0（nix 提供）。
      # 装 setup-node 反而会卡死 —— 它从 raw.githubusercontent.com 拉
      # versions-manifest.json，而服务器到该域名的连接会被重置
      # （curl: (35) Recv failure: Connection reset by peer），
      # 表现为 job 长时间停在 "Setup Node 22" 不动。
      - name: Show toolchain
        run: |
          set -euo pipefail
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # 产物完整性闸门（博客踩过的坑，2026-11-07）
      #
      # 曾经的故障：中转出来的产物只落到零星几个文件，job 照样"成功"，
      # 接着 rsync --delete 把服务器上的站点目录镜像成一个只剩几个文件的空壳，
      # 首页 403、Actions 面板却还是绿的。所以镜像之前必须先确认产物是完整的，
      # 不完整就让 job 失败 —— 宁可这次不部署，也不能把线上清空。
      - name: Verify dist is complete
        run: |
          set -euo pipefail
          count=$(find dist -type f | wc -l)
          echo "产物文件数：$count"
          # 真实产物 5 个文件（index.html + assets/*.css|js + favicon + 字体）。
          # 低于 4 必然是被截断的半成品，直接判死。
          if [ "$count" -lt 4 ]; then
            echo "::error::产物只有 $count 个文件，明显不完整，拒绝镜像到站点目录"
            find dist -maxdepth 2 | head -50
            exit 1
          fi
          for f in index.html assets; do
            if [ ! -e "dist/$f" ]; then
              echo "::error::产物缺少 $f，拒绝部署"
              exit 1
            fi
          done

      - name: Mirror to web root
        run: |
          set -euo pipefail
          # job 与站点目录同机，直接 rsync 本地路径
          rsync -aO --delete dist/ /var/www/bettermath/
          synced=$(find /var/www/bettermath -type f | wc -l)
          echo "已同步文件数：$synced"
          # 镜像后自检：万一中途出错被 --delete 清掉，这里能立刻暴露
          if [ "$synced" -lt 4 ] || [ ! -f /var/www/bettermath/index.html ]; then
            echo "::error::镜像后站点目录只剩 $synced 个文件或缺少 index.html"
            exit 1
          fi

      # 源站自检：绕过 Cloudflare 直连回源 IP，才能确认 nginx 与证书都在位。
      # 直连 Cloudflare 看到的是边缘证书（CN=ylxc.top），验证不了源站。
      - name: Health check (origin)
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 15 \
            --resolve math.ylxc.top:443:47.106.212.155 \
            -o /dev/null -w '%{http_code}' https://math.ylxc.top/)
          echo "源站 https://math.ylxc.top/ → HTTP $code"
          [ "$code" = "200" ] || { echo "::error::源站返回 $code"; exit 1; }
