<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BetterMath · 数学可视化</title>
    <meta
      name="description"
      content="BetterMath —— 用图形、动画与交互把抽象的数学画出来。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/send-flowers-latin.woff2" crossorigin />

    <!-- ── 首屏关键样式（内联）────────────────────────────────
         样式表是由 JS 里 import 的（开发模式下 Vite 注入 <style>，
         生产构建才提取成 <link>）。在它到位之前，浏览器会先把裸 HTML
         画出来 —— 标题变成默认字体、按钮露出边框、布局全乱，也就是 FOUC。

         这段内联样式不依赖任何外部资源，只做一件事：先盖一层纯色加载页。
         JS 就绪后由 dismissBoot() 淡出并移除。 -->
    <style>
      html,
      body {
        margin: 0;
        background: #f7faff;
      }

      /* 加载页铺满视口，盖住还没样式的正文 */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #f7faff;
        transition: opacity 300ms ease;
      }

      #boot.is-done {
        opacity: 0;
        /* 淡出途中别再挡住点击 */
        pointer-events: none;
      }

      /* 单个圆环，不依赖字体与图标库 */
      #boot .boot-ring {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 2px solid rgba(28, 111, 196, 0.16);
        border-top-color: #1c6fc4;
        animation: boot-spin 880ms linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* 尊重减少动效：转慢一点，但保留「正在加载」的视觉提示 */
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-ring {
          animation-duration: 2.4s;
        }
      }
    </style>

    <script type="module" src="/src/main.ts"></script>
  </head>
  <body data-route="home">
    <!-- 加载页在 body 最前面，保证它先于任何内容出现。
         JS 加载或执行失败时也不会永远卡住：下面这段内联脚本兜底移除。 -->
    <div id="boot" role="status" aria-label="加载中">
      <div class="boot-ring"></div>
    </div>
    <script>
      // 兜底：脚本挂了（网络错误、构建异常）也要把页面露出来
      window.setTimeout(function () {
        var el = document.getElementById('boot');
        if (el) el.remove();
      }, 8000);
    </script>

    <!-- 背景符号场：两个视图共用，纯装饰，对辅助技术隐藏 -->
    <canvas id="symbol-field" aria-hidden="true"></canvas>

    <!-- ══ 主页 ═══════════════════════════════════════════════ -->
    <main class="home" id="view-home">
      <!-- 标题与按钮包在一个 .hero 里，居中在第 2 行。
           拆成两个独立子元素的话，它们会各自占一行 1fr / auto，
           标题被顶到屏幕最上面。 -->
      <div class="hero">
        <h1 class="hero__title" id="home-title">BetterMath</h1>

        <!-- 悬停时从下边缘中点扩散一个圆，把「数学可视化」擦成「开始探索」。
             两层文字各自被互补的圆形遮罩裁掉一半，任何时刻只有一层可见，
             所以不会出现两层叠着、笔画打架的情况。 -->
        <button class="hero__cta" type="button" id="enter-button" aria-label="开始探索">
          <!-- 光晕层：与「数学可视化」同文同位，文字本身透明、只留一圈柔光，
               呼吸式明暗变化，暗示这行字可以点。
               它是独立的一层，不参与下面那对圆形遮罩 —— 遮罩会连光晕一起切，
               扫过时边缘就变成一条硬线而不是柔和的晕。 -->
          <span class="hero__cta__halo" aria-hidden="true">数学可视化</span>
          <span class="hero__cta__idle" aria-hidden="true">数学可视化</span>
          <span class="hero__cta__hover" aria-hidden="true">开始探索</span>
        </button>
      </div>

      <footer class="site-foot">
        <span class="site-foot__rule" aria-hidden="true"></span>
        <span>把抽象的形状画出来</span>
        <span class="site-foot__rule" aria-hidden="true"></span>
      </footer>
    </main>

    <!-- ══ 章节页 ═════════════════════════════════════════════ -->
    <main class="chapters" id="view-chapters" hidden>
      <!-- 液态玻璃 header：内容由 JS 注入（分类锚点）。
           显隐由 .is-shown 控制（见 transitions.ts）。 -->
      <header class="chapter-head" id="chapter-head">
        <div class="chapter-head__glass" aria-hidden="true"></div>
        <div class="chapter-head__inner">
          <a class="chapter-head__brand" id="head-title-slot" href="/" aria-label="返回主页">
            <span class="chapter-head__title" id="head-title">BetterMath</span>
          </a>
          <nav class="chapter-head__nav" id="chapter-nav" aria-label="章节分类"></nav>
        </div>
      </header>

      <!-- 章节网格：由 chapters/render.ts 填充 -->
      <div class="chapters__body" id="chapters-body"></div>

      <!-- 章节内容页：与上面的网格互斥显示（切到本章内容时网格 hidden）。
           共用同一个 header，所以在同一个 main 里而不是另开一个视图。 -->
      <div class="chapter-detail" id="chapter-detail" hidden></div>
    </main>

    <!-- 共用 <defs>：代表图形的渐变定义，集中一份 -->
    <svg class="svg-defs" aria-hidden="true" focusable="false" width="0" height="0">
      <defs>
        <linearGradient id="bm-fig-line" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#3b8fe0" />
          <stop offset="0.55" stop-color="#2a4ca0" />
          <stop offset="1" stop-color="#12386e" />
        </linearGradient>
        <linearGradient id="bm-fig-soft" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#1c6fc4" stop-opacity="0" />
          <stop offset="1" stop-color="#1c6fc4" stop-opacity="0.22" />
        </linearGradient>
      </defs>
    </svg>
  </body>
</html>
